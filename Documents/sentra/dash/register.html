<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register • Sentra Systems</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e8eaf6;
            padding: 20px;
        }

        .register-container {
            background: rgba(20, 25, 45, 0.95);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 700;
            color: #6c7ff2;
            margin-bottom: 8px;
        }

        .logo p {
            font-size: 14px;
            color: #9ca3af;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #b8c1ec;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            background: rgba(30, 35, 55, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e8eaf6;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #6c7ff2;
            background: rgba(30, 35, 55, 1);
            box-shadow: 0 0 0 3px rgba(108, 127, 242, 0.1);
        }

        .form-group input::placeholder {
            color: #6b7280;
        }

        .form-group small {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            color: #6b7280;
        }

        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s;
            background: #ef4444;
        }

        .password-strength-bar.weak { width: 33%; background: #ef4444; }
        .password-strength-bar.medium { width: 66%; background: #f59e0b; }
        .password-strength-bar.strong { width: 100%; background: #22c55e; }

        .btn-register {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #6c7ff2 0%, #8c9ff5 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 24px;
            margin-bottom: 16px;
        }

        .btn-register:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(108, 127, 242, 0.3);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            font-size: 14px;
            color: #9ca3af;
        }

        .login-link a {
            color: #6c7ff2;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 32px 24px;
            }

            .logo h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <h1>Sentra Systems</h1>
            <p>Development Studio Access</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="johndoe" autocomplete="username">
                <small>Choose a unique username for login</small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password">
                <div class="password-strength">
                    <div id="passwordStrengthBar" class="password-strength-bar"></div>
                </div>
                <small id="passwordHint">At least 8 characters</small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn-register" id="registerBtn">
                Create Account
            </button>
        </form>

        <div class="login-link">
            Already have an account? <a href="/login">Sign in</a>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let isSubmitting = false;

        const form = document.getElementById('registerForm');
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const registerBtn = document.getElementById('registerBtn');
        const alertBox = document.getElementById('alert');
        const passwordStrengthBar = document.getElementById('passwordStrengthBar');
        const passwordHint = document.getElementById('passwordHint');

        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.className = `alert ${type}`;
            alertBox.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    alertBox.style.display = 'none';
                }, 5000);
            }
        }

        function hideAlert() {
            alertBox.style.display = 'none';
        }

        function checkPasswordStrength(password) {
            let strength = 0;
            
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z\d]/.test(password)) strength++;

            if (strength <= 2) {
                passwordStrengthBar.className = 'password-strength-bar weak';
                passwordHint.textContent = 'Weak password';
                return 'weak';
            } else if (strength <= 4) {
                passwordStrengthBar.className = 'password-strength-bar medium';
                passwordHint.textContent = 'Medium strength password';
                return 'medium';
            } else {
                passwordStrengthBar.className = 'password-strength-bar strong';
                passwordHint.textContent = 'Strong password!';
                return 'strong';
            }
        }

        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            if (password) {
                checkPasswordStrength(password);
            } else {
                passwordStrengthBar.className = 'password-strength-bar';
                passwordHint.textContent = 'At least 8 characters';
            }
        });

        async function handleRegister(e) {
            e.preventDefault();
            
            if (isSubmitting) return;
            
            hideAlert();
            
            const username = usernameInput.value.trim() || null;
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            // Validation
            if (!email || !password) {
                showAlert('Please fill in all required fields');
                return;
            }

            if (password.length < 8) {
                showAlert('Password must be at least 8 characters long');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Passwords do not match');
                return;
            }

            isSubmitting = true;
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="loading-spinner"></span>Creating account...';

            try {
                const response = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.ok) {
                    showAlert('Account created successfully! Redirecting to login...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = '/login?registered=true';
                    }, 2000);
                } else {
                    let errorMessage = 'Registration failed';
                    
                    if (data.error === 'email_already_exists') {
                        errorMessage = 'An account with this email already exists';
                    } else if (data.error === 'invalid_email') {
                        errorMessage = 'Please enter a valid email address';
                    } else if (data.error === 'password_too_short') {
                        errorMessage = 'Password must be at least 8 characters long';
                    } else if (data.error) {
                        errorMessage = data.error.replace(/_/g, ' ');
                    }
                    
                    showAlert(errorMessage);
                }
            } catch (error) {
                console.error('Registration error:', error);
                showAlert('Connection error. Please check your network and try again.');
            } finally {
                isSubmitting = false;
                registerBtn.disabled = false;
                registerBtn.textContent = 'Create Account';
            }
        }

        form.addEventListener('submit', handleRegister);
        emailInput.focus();
    </script>
</body>
</html>
