<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sentra Core • Sentra Systems</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#0a0e27;color:#e8eaf6;padding:20px;line-height:1.6}
    .container{max-width:1200px;margin:0 auto}
    h1{font-size:28px;margin-bottom:8px;color:#fff}
    .subtitle{color:#9fa8da;margin-bottom:24px;font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:24px}
    .card{background:#1a1f3a;border:1px solid #2c3454;border-radius:8px;padding:20px}
    .card h2{font-size:16px;color:#7986cb;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px}
    .status-indicator{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
    .status-indicator.ok{background:#4caf50}
    .status-indicator.warn{background:#ff9800}
    .status-indicator.error{background:#f44336}
    .stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2c3454}
    .stat:last-child{border-bottom:none}
    .stat-label{color:#9fa8da}
    .stat-value{color:#fff;font-weight:500}
    .module-list{list-style:none}
    .module-item{padding:6px 0;color:#c5cae9;font-family:monospace;font-size:13px}
    .loading{text-align:center;padding:40px;color:#7986cb}
    .error{color:#f44336;padding:12px;background:#2d1414;border:1px solid #5c1a1a;border-radius:4px;margin:12px 0}
    .refresh-btn{background:#5c6bc0;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:14px}
    .refresh-btn:hover{background:#7986cb}
    .error-item{background:#2d1414;border:1px solid #5c1a1a;border-radius:4px;padding:12px;margin-bottom:8px;font-family:monospace;font-size:12px}
    .error-item .error-msg{color:#ef5350;margin-bottom:4px}
    .error-item .error-trace{color:#9fa8da;font-size:11px;white-space:pre-wrap;margin-top:8px;max-height:150px;overflow-y:auto}
    .no-errors{color:#4caf50;text-align:center;padding:20px}
    .footer{text-align:center;margin-top:40px;padding:20px;color:#7986cb;font-size:13px;border-top:1px solid #2c3454}
    .footer a{color:#9fa8da;text-decoration:none}
    .footer a:hover{color:#c5cae9}
  </style>
</head>
<body>
  <div class="container">
    <h1>Sentra Core</h1>
    <p class="subtitle">Sentra Systems • System Status Dashboard</p>
    
    <div id="content" class="loading">Loading system status...</div>
    
    <div class="footer">
      <strong>Sentra Systems</strong> • Sentra Core v1.0<br>
      <a href="/static/services.html">Services</a> • <a href="/dev">Developer</a> • <a href="/api/errors">Errors API</a>
    </div>
  </div>

  <script>
    async function fetchJSON(url){
      const res = await fetch(url);
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function renderStatus(health, modules, errors){
      const isOk = health.ok && !health.startup_waiting;
      const statusClass = isOk ? 'ok' : (health.startup_waiting ? 'warn' : 'error');
      const statusText = isOk ? 'Operational' : (health.startup_waiting ? 'Waiting for startup signature' : 'Error');

      return `
        <div class="grid">
          <div class="card">
            <h2>Core Status</h2>
            <div class="stat">
              <span class="stat-label">Status</span>
              <span class="stat-value"><span class="status-indicator ${statusClass}"></span>${statusText}</span>
            </div>
            <div class="stat">
              <span class="stat-label">Version</span>
              <span class="stat-value">${health.version || 'N/A'}</span>
            </div>
            <div class="stat">
              <span class="stat-label">Port</span>
              <span class="stat-value">${health.port || 'N/A'}</span>
            </div>
            <div class="stat">
              <span class="stat-label">LAN Only</span>
              <span class="stat-value">${health.lan_only ? 'Yes' : 'No'}</span>
            </div>
          </div>

          <div class="card">
            <h2>Loaded Modules</h2>
            ${modules.length > 0 
              ? `<ul class="module-list">${modules.map(m => `<li class="module-item">${m}</li>`).join('')}</ul>`
              : '<p style="color:#9fa8da">No modules loaded</p>'
            }
          </div>

          <div class="card">
            <h2>System Info</h2>
            <div class="stat">
              <span class="stat-label">Uptime</span>
              <span class="stat-value" id="uptime">Calculating...</span>
            </div>
            <div class="stat">
              <span class="stat-label">Timestamp</span>
              <span class="stat-value">${new Date().toLocaleString()}</span>
            </div>
            <div class="stat">
              <span class="stat-label"></span>
              <button class="refresh-btn" onclick="loadStatus()">Refresh</button>
            </div>
          </div>
        </div>

        <div class="card">
          <h2>Recent Errors</h2>
          ${errors && errors.length > 0 
            ? errors.map(err => `
              <div class="error-item">
                <div class="error-msg">${err.message || 'Unknown error'}</div>
                <div style="color:#7986cb;font-size:11px">${err.file || 'unknown'}:${err.line || '?'} • ${err.timestamp || 'unknown time'}</div>
                ${err.traceback ? `<div class="error-trace">${err.traceback}</div>` : ''}
              </div>
            `).join('')
            : '<div class="no-errors">✓ No errors detected</div>'
          }
        </div>
      `;
    }

    async function loadStatus(){
      try{
        document.getElementById('content').className = 'loading';
        document.getElementById('content').innerHTML = 'Loading system status...';
        
        const [health, coreInfo, errorsData] = await Promise.all([
          fetchJSON('/health'),
          fetchJSON('/startup/info').catch(() => ({modules:[]})),
          fetchJSON('/api/errors').catch(() => ({errors:[]}))
        ]);

        const modules = coreInfo.modules || [];
        const errors = errorsData.errors || [];
        document.getElementById('content').innerHTML = renderStatus(health, modules, errors);
        document.getElementById('content').className = '';

        // Update uptime if issued_at is available
        if(health.issued_at){
          const uptimeSeconds = Math.floor(Date.now()/1000 - health.issued_at);
          const hours = Math.floor(uptimeSeconds / 3600);
          const minutes = Math.floor((uptimeSeconds % 3600) / 60);
          document.getElementById('uptime').textContent = `${hours}h ${minutes}m`;
        }
      }catch(e){
        document.getElementById('content').className = '';
        document.getElementById('content').innerHTML = `<div class="error">Failed to load status: ${e.message}</div><button class="refresh-btn" onclick="loadStatus()">Retry</button>`;
      }
    }

    // Auto-load on page load
    loadStatus();

    // Auto-refresh every 30 seconds
    setInterval(loadStatus, 30000);
  </script>
</body>
</html>
