<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentra Admin Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', 'Monaco', 'Consolas', monospace;
            background: #0a0e27;
            color: #00ff41;
            min-height: 100vh;
        }

        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: linear-gradient(135deg, rgba(139,92,246,0.08), rgba(34,211,238,0.06));
            border-right: 1px solid rgba(0, 255, 65, 0.2);
            padding: 2rem 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 0 1.5rem 2rem;
            border-bottom: 1px solid rgba(0, 255, 65, 0.1);
            margin-bottom: 1.5rem;
        }

        .sidebar-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff41;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sidebar-subtitle {
            font-size: 0.75rem;
            color: #666;
            margin-top: 0.25rem;
            letter-spacing: 0.1em;
        }

        .sidebar-nav {
            padding: 0 1rem;
        }

        .nav-section {
            margin-bottom: 1.5rem;
        }

        .nav-section-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #666;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            margin: 0.25rem 0;
            color: #00cc33;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-item:hover {
            background: rgba(0, 255, 65, 0.1);
            color: #00ff41;
        }

        .nav-item.active {
            background: rgba(0, 255, 65, 0.15);
            color: #00ff41;
            border-left: 3px solid #00ff41;
        }

        .nav-icon {
            width: 20px;
            text-align: center;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 2rem;
        }

        .header {
            background: linear-gradient(135deg, rgba(139,92,246,0.12), rgba(34,211,238,0.08));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .header-title {
            font-size: 1.75rem;
            font-weight: bold;
            color: #00ff41;
        }

        .header-subtitle {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: 1px solid #00ff41;
            background: rgba(0, 255, 65, 0.1);
            color: #00ff41;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }

        .btn-purple {
            border-color: #a855f7;
            color: #a855f7;
            background: rgba(168, 85, 247, 0.1);
        }

        .btn-purple:hover {
            background: rgba(168, 85, 247, 0.2);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }

        /* Card */
        .card {
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 12px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .card-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(0, 255, 65, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.1rem;
            color: #00ff41;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-body {
            padding: 1.5rem;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            gap: 1.5rem;
        }

        .grid-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        .grid-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        @media (max-width: 1024px) {
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid rgba(0, 255, 65, 0.2);
            color: #00ff41;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(0, 255, 65, 0.1);
            color: #00cc33;
        }

        tr:hover {
            background: rgba(0, 255, 65, 0.05);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-success {
            background: rgba(0, 255, 65, 0.2);
            color: #00ff41;
            border: 1px solid #00ff41;
        }

        .badge-warning {
            background: rgba(255, 170, 0, 0.2);
            color: #ffaa00;
            border: 1px solid #ffaa00;
        }

        .badge-danger {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        .badge-info {
            background: rgba(168, 85, 247, 0.2);
            color: #a855f7;
            border: 1px solid #a855f7;
        }

        /* Status Indicator */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
        }

        .status-dot.online {
            background: #00ff41;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .status-dot.offline {
            background: #666;
        }

        .status-dot.warning {
            background: #ffaa00;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    ⬡ Sentra Admin
                </div>
                <div class="sidebar-subtitle">Control Center</div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Overview</div>
                    <a href="#dashboard" class="nav-item active" onclick="showSection('dashboard')">
                        <span class="nav-icon">📊</span>
                        <span>Dashboard</span>
                    </a>
                    <a href="#analytics" class="nav-item" onclick="showSection('analytics')">
                        <span class="nav-icon">📈</span>
                        <span>Analytics</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Management</div>
                    <a href="#employees" class="nav-item" onclick="showSection('employees')">
                        <span class="nav-icon">👥</span>
                        <span>Employees</span>
                    </a>
                    <a href="#tasks" class="nav-item" onclick="showSection('tasks')">
                        <span class="nav-icon">✓</span>
                        <span>Tasks & Jobs</span>
                    </a>
                    <a href="#projects" class="nav-item" onclick="showSection('projects')">
                        <span class="nav-icon">📁</span>
                        <span>Projects</span>
                    </a>
                    <a href="#gallery" class="nav-item" onclick="showSection('gallery')">
                        <span class="nav-icon">🖼️</span>
                        <span>Gallery</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Financial</div>
                    <a href="#payroll" class="nav-item" onclick="showSection('payroll')">
                        <span class="nav-icon">💰</span>
                        <span>Payroll</span>
                    </a>
                    <a href="#sales" class="nav-item" onclick="showSection('sales')">
                        <span class="nav-icon">💵</span>
                        <span>Sales</span>
                    </a>
                    <a href="#invoices" class="nav-item" onclick="showSection('invoices')">
                        <span class="nav-icon">📄</span>
                        <span>Invoices</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Business</div>
                    <a href="#partners" class="nav-item" onclick="showSection('partners')">
                        <span class="nav-icon">🤝</span>
                        <span>Partners</span>
                    </a>
                    <a href="#clients" class="nav-item" onclick="showSection('clients')">
                        <span class="nav-icon">👤</span>
                        <span>Clients</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">System</div>
                    <a href="/static/auth_control.html" class="nav-item">
                        <span class="nav-icon">🔐</span>
                        <span>Auth Control</span>
                    </a>
                    <a href="/static/site_settings.html" class="nav-item">
                        <span class="nav-icon">🎨</span>
                        <span>Site Settings</span>
                    </a>
                    <a href="/dev" class="nav-item">
                        <span class="nav-icon">⚙️</span>
                        <span>Dev Panel</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="page-content"></div>
        </main>
    </div>

    <script>
        let currentPage = 'overview';
        let loadedStyles = new Set();
        let loadedScripts = new Set();
        
        function showSection(pageName) {
            currentPage = pageName;
            loadPage(pageName);
            
            // Update active nav item
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.nav-item').classList.add('active');
        }
        
        async function loadPage(pageName) {
            const contentDiv = document.getElementById('page-content');
            
            try {
                // Load HTML
                const htmlResponse = await fetch(`/dash/pages/${pageName}/${pageName}.html`);
                const html = await htmlResponse.text();
                contentDiv.innerHTML = html;
                
                // Load CSS if not already loaded
                if (!loadedStyles.has(pageName)) {
                    const link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = `/dash/pages/${pageName}/${pageName}.css`;
                    document.head.appendChild(link);
                    loadedStyles.add(pageName);
                }
                
                // Load and execute JS
                if (!loadedScripts.has(pageName)) {
                    const scriptResponse = await fetch(`/dash/pages/${pageName}/${pageName}.js`);
                    const scriptText = await scriptResponse.text();
                    const script = document.createElement('script');
                    script.textContent = scriptText;
                    document.body.appendChild(script);
                    loadedScripts.add(pageName);
                }
                
            } catch (err) {
                console.error(`Failed to load page ${pageName}:`, err);
                contentDiv.innerHTML = `<h2 style="color: #00ff41;">Error loading page</h2><p style="color: #666;">${err.message}</p>`;
            }
        }
        
        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', () => {
            loadPage('overview');
        });
    </script>
</body>
</html>
