version: '3.8'

# Sentra Microservices Architecture
# Matches VPS production setup

networks:
  sentra-network:
    driver: bridge

volumes:
  sentra-redis:

services:
  # ==================== CORE SERVICES ====================
  
  sentra-core:
    build: .
    ports:
      - "8000:8000"
    networks:
      - sentra-network
    volumes:
      - ./db:/opt/sentra-core/db
      - ./uploads:/opt/sentra-core/uploads
      - ./logs:/opt/sentra-core/logs
      - ./state.json:/opt/sentra-core/state.json
      - ./licenses:/opt/sentra-core/licenses:ro
    environment:
      - SENTRA_ENV=production
      - SENTRA_PORT=8000
      - SENTRA_HOST=0.0.0.0
      - REDIS_URL=redis://sentra-redis:6379
      - SERVICE_REGISTRY=http://sentra-registry:8081
    depends_on:
      - sentra-redis
      - sentra-registry
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/core/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
  
  # Service Registry - Tracks all running services
  sentra-registry:
    build: ./services/registry
    ports:
      - "8081:8081"
    networks:
      - sentra-network
    environment:
      - PORT=8081
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  
  # Redis - For pub/sub and caching
  sentra-redis:
    image: redis:7-alpine
    networks:
      - sentra-network
    volumes:
      - sentra-redis:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
  
  # ==================== BUSINESS SERVICES ====================
  
  # DNS Service - Cloudflare DNS management
  sentra-dns:
    build: ./services/dns
    networks:
      - sentra-network
    environment:
      - SERVICE_NAME=dns
      - SERVICE_PORT=8084
      - CORE_URL=http://sentra-core:8000
      - REGISTRY_URL=http://sentra-registry:8081
      - CF_API_TOKEN=${CF_API_TOKEN}
      - CF_ZONE_ID=${CF_ZONE_ID}
    depends_on:
      - sentra-core
      - sentra-registry
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  
  # Deploy Service - Docker container management
  sentra-deploy:
    build: ./services/deploy
    networks:
      - sentra-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - SERVICE_NAME=deploy
      - SERVICE_PORT=8083
      - CORE_URL=http://sentra-core:8000
      - REGISTRY_URL=http://sentra-registry:8081
    depends_on:
      - sentra-core
      - sentra-registry
    restart: unless-stopped
    privileged: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  
  # Metrics Service - System monitoring
  sentra-metrics:
    build: ./services/metrics
    networks:
      - sentra-network
    environment:
      - SERVICE_NAME=metrics
      - SERVICE_PORT=8087
      - CORE_URL=http://sentra-core:8000
      - REGISTRY_URL=http://sentra-registry:8081
      - REDIS_URL=redis://sentra-redis:6379
    depends_on:
      - sentra-core
      - sentra-redis
      - sentra-registry
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8087/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  
  # Telemetry Service - Event logging
  sentra-telemetry:
    build: ./services/telemetry
    networks:
      - sentra-network
    volumes:
      - ./db:/data
    environment:
      - SERVICE_NAME=telemetry
      - SERVICE_PORT=8085
      - CORE_URL=http://sentra-core:8000
      - REGISTRY_URL=http://sentra-registry:8081
      - DATA_DIR=/data
    depends_on:
      - sentra-core
      - sentra-registry
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  
  # VPN Service - WireGuard management
  sentra-vpn:
    build: ./services/vpn
    networks:
      - sentra-network
    cap_add:
      - NET_ADMIN
    environment:
      - SERVICE_NAME=vpn
      - SERVICE_PORT=8086
      - CORE_URL=http://sentra-core:8000
      - REGISTRY_URL=http://sentra-registry:8081
    depends_on:
      - sentra-core
      - sentra-registry
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  
  # ==================== DASHBOARD ====================
  
  sentra-dash:
    image: nginx:alpine
    ports:
      - "8080:80"
    networks:
      - sentra-network
    volumes:
      - ./static:/usr/share/nginx/html:ro
    depends_on:
      - sentra-core
    restart: unless-stopped
